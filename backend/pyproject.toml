[project]
name = "python-starter-backend"
version = "0.1.0"
description = "Flask backend for the Python Starter learning site"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "flask>=3.1.0,<4.0.0",
  "gunicorn>=23.0.0,<24.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests/backend"]
