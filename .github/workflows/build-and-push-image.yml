name: Build And Push Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-and-push-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        run: |
          echo "uri=docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "latest=docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
